# See https://woodpecker-ci.org/docs/intro

when:
  event: [push, pull_request]

matrix:
  PHP_BIN:
    - /opt/php-5.4.9/bin/
    - /opt/php-5.5.38/bin/
    - /opt/php-5.6.28/bin/
    - /opt/php-7.0.13/bin/
    - /opt/php-7.1.0/bin/
  GEOS_BIN:
    - /opt/geos-3.4.3/bin/
    - /opt/geos-3.5.2/bin/
    - /opt/geos-3.6.6/bin/

steps:
  - name: build
    image: docker.osgeo.org/geos/php-build-test:trisquel
    pull: true
    commands:
      - export PATH=${PHP_BIN}:${GEOS_BIN}:$${PATH}
      - echo $${PATH}
      - php --version
      #  Always use newest phpize or we'll be hit by
      #  false negatives on make check, see
      #  https://git.osgeo.org/gogs/geos/php-geos/issues/16
      - /opt/php-7.1.0/bin/phpize
      - ./configure
      - make
      - make check
